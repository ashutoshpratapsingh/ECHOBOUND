<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030a09" />
  <meta name="description" content="ECHOBOUND: Realms of Echo - An innovative 2D atmospheric jungle adventure prototype featuring the Echo Pulse mechanic, 3 distinct levels, dynamic organic physics hazards, and the Anaconda Guardian boss encounter." />
  <title>ECHOBOUND: Realms of Echo (3-Level Prototype)</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
</head>
<body>
  <div id="game-container"></div>

  <div id="quick-bar">
    <span>🌿 ECHOBOUND: 3-LEVEL GAME PROTOTYPE</span>
    <span>🕹️ CONTROLS: A/D (MOVE) | SPACE (JUMP) | E (ECHO PULSE)</span>
    <span>📱 TOUCH CONTROLS ENABLED</span>
  </div>

  <!-- PHASER 3 ENGINE (Local offline bundle with CDN fallback) -->
  <script src="./libs/phaser.min.js"></script>
  <script>
    if (typeof Phaser === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\\/script>');
    }
  </script>

  <!-- GAME ARCHITECTURE (Sequential script loading for 100% universal compatibility) -->
  <script src="./src/audio/SoundManager.js"></script>
  <script src="./src/entities/AnacondaBoss.js"></script>
  <script src="./src/scenes/MenuScene.js"></script>
  <script src="./src/scenes/GameScene.js"></script>
  <script src="./src/scenes/VictoryScene.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
